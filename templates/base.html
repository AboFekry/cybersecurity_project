<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{% block title %}Secure Notes{% endblock %}</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family:
          "Inter",
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
        background:
          radial-gradient(
            circle at top left,
            rgba(40, 215, 173, 0.16),
            transparent 30%
          ),
          radial-gradient(
            circle at bottom right,
            rgba(248, 135, 83, 0.18),
            transparent 32%
          ),
          linear-gradient(180deg, #07101d 0%, #0f1a2b 100%);
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 24px;
        color: #e6edf6;
      }

      .container {
        background: rgba(11, 24, 40, 0.95);
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 24px;
        box-shadow: 0 30px 80px rgba(4, 20, 40, 0.55);
        padding: 36px;
        max-width: 520px;
        width: 100%;
        backdrop-filter: blur(16px);
      }

      h1,
      h2 {
        margin-bottom: 12px;
        text-align: center;
        letter-spacing: 0.02em;
      }

      h1 {
        color: #f5f9ff;
        font-size: 2rem;
      }

      h2 {
        color: #98d1ff;
        font-size: 1.05rem;
        font-weight: 500;
      }

      .subtitle {
        text-align: center;
        color: #a9b7d9;
        margin-bottom: 28px;
        font-size: 0.95rem;
      }

      .form-group {
        margin-bottom: 18px;
      }

      label {
        display: block;
        margin-bottom: 10px;
        color: #b8c7e0;
        font-weight: 600;
        font-size: 0.95rem;
      }

      input[type="text"],
      input[type="password"],
      textarea {
        width: 100%;
        padding: 14px 16px;
        border: 1px solid rgba(255, 255, 255, 0.12);
        border-radius: 14px;
        background: rgba(255, 255, 255, 0.04);
        color: #edf2ff;
        font-size: 0.98rem;
        transition:
          border-color 0.25s ease,
          box-shadow 0.25s ease;
      }

      input[type="text"]:focus,
      input[type="password"]:focus,
      textarea:focus {
        outline: none;
        border-color: #18d29e;
        box-shadow: 0 0 0 6px rgba(24, 210, 158, 0.12);
      }

      textarea {
        resize: vertical;
        min-height: 130px;
      }

      button {
        width: 100%;
        padding: 14px 16px;
        background: linear-gradient(135deg, #18d29e 0%, #3cd4bf 100%);
        color: #07101d;
        border: none;
        border-radius: 14px;
        font-size: 1rem;
        font-weight: 700;
        cursor: pointer;
        transition:
          transform 0.2s ease,
          box-shadow 0.2s ease;
        box-shadow: 0 18px 35px rgba(24, 210, 158, 0.24);
      }

      button:hover {
        transform: translateY(-2px);
        box-shadow: 0 24px 40px rgba(24, 210, 158, 0.28);
      }

      button:active {
        transform: translateY(0);
      }

      .link-group {
        text-align: center;
        margin-top: 24px;
        color: #91a7c4;
        font-size: 0.93rem;
      }

      .link-group a {
        color: #18d29e;
        text-decoration: none;
        font-weight: 700;
        transition: color 0.25s ease;
      }

      .link-group a:hover {
        color: #8df1bf;
      }

      .alert {
        padding: 14px 16px;
        border-radius: 16px;
        margin-bottom: 20px;
        font-size: 0.94rem;
        line-height: 1.5;
      }

      .alert-danger {
        background-color: rgba(255, 84, 84, 0.14);
        color: #ff8f8f;
        border: 1px solid rgba(255, 84, 84, 0.2);
      }

      .alert-success {
        background-color: rgba(56, 232, 132, 0.14);
        color: #b8ffdd;
        border: 1px solid rgba(56, 232, 132, 0.22);
      }

      .alert-info {
        background-color: rgba(103, 189, 255, 0.14);
        color: #b9e7ff;
        border: 1px solid rgba(103, 189, 255, 0.22);
      }

      .nav {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 30px;
        padding-bottom: 20px;
        border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      }

      .nav h1 {
        margin: 0;
        color: #f5f9ff;
        font-size: 1.4rem;
      }

      .nav a {
        color: #18d29e;
        text-decoration: none;
        font-weight: 700;
        transition: color 0.25s ease;
      }

      .nav a:hover {
        color: #8df1bf;
      }

      .notes-list {
        display: flex;
        flex-direction: column;
        gap: 16px;
      }

      .note-item {
        background: rgba(255, 255, 255, 0.04);
        border-left: 4px solid #18d29e;
        padding: 18px;
        border-radius: 18px;
        word-break: break-word;
        transition:
          transform 0.2s ease,
          background 0.2s ease;
      }

      .note-item:hover {
        background: rgba(255, 255, 255, 0.08);
        transform: translateY(-1px);
      }

      .note-item p {
        color: #e8f5ff;
        margin: 0;
      }

      .note-date {
        font-size: 0.85rem;
        color: #8da8c3;
        margin-top: 10px;
      }

      .dashboard {
        background: rgba(8, 18, 33, 0.96);
        border-radius: 24px;
        box-shadow: 0 35px 90px rgba(4, 20, 40, 0.55);
        padding: 42px;
        max-width: 860px;
        width: 100%;
      }
    </style>
  </head>
  <body>
    {% with messages = get_flashed_messages() %} {% if messages %} {% for
    message in messages %}
    <div
      style="
        position: fixed;
        top: 20px;
        right: 20px;
        max-width: 400px;
        z-index: 1000;
      "
    >
      <div class="alert alert-danger">{{ message }}</div>
    </div>
    {% endfor %} {% endif %} {% endwith %} {% block content %}{% endblock %}
  </body>
</html>
